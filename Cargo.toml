[package]
name = "bitbi"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono =  { version = "0.4.45", features = ["serde"]}
config = "0.15.26"
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
